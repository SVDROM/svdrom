ci:
  autoupdate_commit_msg: "chore: update pre-commit hooks"
  autofix_commit_msg: "style: pre-commit fixes"

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: "v4.6.0"
    hooks:
      - id: check-added-large-files
        args: ["--maxkb=2000"]
        exclude: ^demos/media/(ux_original|ux_reconstruct)\.gif$
      - id: check-case-conflict
      - id: check-merge-conflict
      - id: check-symlinks
      - id: check-yaml
      - id: debug-statements
      - id: end-of-file-fixer
      - id: mixed-line-ending
      - id: requirements-txt-fixer
      - id: trailing-whitespace

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: "v0.5.5"
    hooks:
      # first, lint + autofix
      - id: ruff
        types_or: [python, pyi, jupyter]
        args: ["--fix", "--show-fixes"]
      # then, format
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: "v1.17.1"
    hooks:
      - id: mypy
        files: src
        args: []
        # because pre-commit runs mypy from an isolated environment, we need to add typed dependencies here
        additional_dependencies:
          - importlib_metadata
          - pytest
          - xarray
          - dask
          - zarr<=3.1.0
          - pydmd
          - pandas
          - pandas-stubs
          - numpy==2.4.6; python_version >= '3.11'
          - numpy==2.2.6; python_version < '3.11'
          - weatherbench2 @ git+https://github.com/google-research/weatherbench2.git@8b55eb3680a4862565fdbffd26dec76201fdad2d

  - repo: https://github.com/astral-sh/uv-pre-commit
    # uv version.
    rev: 0.11.31
    hooks:
      - id: uv-lock
