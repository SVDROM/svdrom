name: Security audit

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "uv.lock"
      - "pyproject.toml"
      - ".github/workflows/security-audit.yml"
  schedule:
    - cron: "0 7 * * 1"  # Mondays at 07:00 UTC

jobs:
  uv-audit:
    name: Audit uv.lock for known vulnerabilities
    runs-on: ubuntu-latest
    # Non-blocking until existing findings in uv.lock are resolved; remove once green.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      - name: Audit locked dependencies
        run: uv audit --locked --preview-features audit-command
