name: Security audit

on:
  workflow_dispatch:
  pull_request:
  schedule:
    - cron: "0 7 * * 1"  # Mondays at 07:00 UTC

jobs:
  uv-audit:
    name: Audit uv.lock for known vulnerabilities
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      - name: Audit locked dependencies
        run: uv audit --locked --preview-features audit-command
