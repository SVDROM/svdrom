name: Security audit

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "uv.lock"
      - "pyproject.toml"
      - ".github/workflows/security-audit.yml"
  schedule:
    - cron: "23 7 * * 1"  # Mondays at 07:23 UTC (off the hour to avoid dropped runs)

jobs:
  uv-audit:
    name: Audit uv.lock for known vulnerabilities
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7

      - name: Audit locked dependencies
        # cryptography: apache-beam (weather extra, via weatherbench2) caps
        # cryptography <49; drop these ignores once it allows cryptography>=50.
        # pillow (41 GHSAs, fixed in 13.0.0): apache-beam caps pillow <13
        # (2.76.0 and 2.77.0); drop these ignores once it allows pillow>=13.
        # filelock (6 GHSAs, fixed in 4.2.1): filelock>=4.1.1 requires
        # Python >=3.11, so the Python 3.10 fork of uv.lock stays on 4.1.0
        # (3.11+ resolves the fixed 4.2.4); drop these ignores once filelock
        # ships a fix for Python 3.10 or svdrom drops Python 3.10.
        run: >-
          uv audit --locked --preview-features audit-command
          --ignore PYSEC-2026-3554 --ignore GHSA-m2h6-j472-rp4c
          --ignore PYSEC-2026-3553 --ignore GHSA-jwv3-5hgf-82ww
          --ignore PYSEC-2026-3552 --ignore GHSA-g6cj-pr64-35w5
          --ignore GHSA-22hg-r758-rrw9 --ignore GHSA-24rc-8hj2-v98c --ignore GHSA-254f-3936-288h
          --ignore GHSA-27h8-gf7j-v5hc --ignore GHSA-332p-7hrc-92wf --ignore GHSA-3j72-p6qg-6xp7
          --ignore GHSA-4558-3h8r-v8xp --ignore GHSA-462x-pgg6-55fp --ignore GHSA-4rm8-3hmm-39fg
          --ignore GHSA-4rr5-89j8-mwwm --ignore GHSA-58r4-6rv3-gfh8 --ignore GHSA-5x8w-8jj5-q52h
          --ignore GHSA-5xm2-6676-qcp9 --ignore GHSA-654x-cwwv-5j9c --ignore GHSA-65qm-jvmh-6pqg
          --ignore GHSA-74r2-7ff9-mjj2 --ignore GHSA-78g4-xqwv-q3g8 --ignore GHSA-7mwm-ghpf-9vrm
          --ignore GHSA-8g5g-8vmr-9782 --ignore GHSA-9v9v-9qvf-h2hj --ignore GHSA-c6hw-5grf-ff96
          --ignore GHSA-cp9v-662q-vvx9 --ignore GHSA-f2g6-542v-9j58 --ignore GHSA-fc9g-5qg7-mf45
          --ignore GHSA-g4qv-2jxx-769h --ignore GHSA-g7cr-3p24-7wf7 --ignore GHSA-g842-9rc4-69pw
          --ignore GHSA-gg2r-wvfm-q9rx --ignore GHSA-j4m9-6w36-pw47 --ignore GHSA-jg86-v3jv-hrpm
          --ignore GHSA-mrfp-p49p-3hf2 --ignore GHSA-p4wg-p73j-c528 --ignore GHSA-p8hx-v2p6-rp84
          --ignore GHSA-pchr-8j38-3x4p --ignore GHSA-q45j-58j2-45rg --ignore GHSA-rfgq-q3w2-pmv2
          --ignore GHSA-v9pv-5gc8-w2m6 --ignore GHSA-vx6w-vv9f-6gvg --ignore GHSA-w889-685w-c8fh
          --ignore GHSA-xgh8-jp6q-p5x8 --ignore GHSA-xvh5-g6gv-559v
          --ignore GHSA-2g95-wg33-c5x2 --ignore GHSA-567q-5qvw-pf92 --ignore GHSA-9vhv-jxww-xfm5
          --ignore GHSA-crv4-6mhj-j5jh --ignore GHSA-jqc4-5cvw-7w85 --ignore GHSA-v4x8-3wr5-3wq8
